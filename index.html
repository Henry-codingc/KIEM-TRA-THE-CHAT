<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Sinh - Kiểm Tra Thể Chất</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2.5 rounded-xl"><i class="fa-solid fa-graduation-cap text-2xl"></i></div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Cổng Kiểm Tra Thể Chất</h1>
                    <p class="text-xs text-indigo-200">Môn Giáo Dục Thể Chất - Trực Tuyến</p>
                </div>
            </div>
            <div id="studentInfoDisplay" class="hidden text-xs bg-indigo-800 px-3 py-1.5 rounded-lg font-bold"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- KHU VỰC ĐĂNG NHẬP -->
        <section id="loginSection" class="bg-white rounded-2xl shadow-md p-8 border max-w-md mx-auto space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-xl font-bold text-slate-800">Đăng Nhập Làm Bài</h2>
                <p class="text-xs text-slate-500">Chọn khối và đợt thi theo thông báo của giáo viên</p>
            </div>
            
            <div id="examNotice" class="p-3 bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-xl text-center font-semibold">
                Đang kiểm tra trạng thái kỳ thi...
            </div>

            <form id="loginForm" onsubmit="handleStudentLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Chọn Khối *</label>
                    <select id="studentGradeSelect" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option value="">-- Chọn Khối Lớp --</option>
                        <option value="6">Khối 6</option>
                        <option value="7">Khối 7</option>
                        <option value="8">Khối 8</option>
                        <option value="9">Khối 9</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Chọn Đợt Thi *</label>
                    <select id="studentPeriodSelect" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option value="">-- Chọn Đợt Kiểm Tra / Kỳ Thi --</option>
                        <option value="KTTX Lần 1">Kiểm Tra Thường Xuyên Lần 1 (HK1)</option>
                        <option value="KTTX Lần 2">Kiểm Tra Thường Xuyên Lần 2 (HK1)</option>
                        <option value="GK1">Giữa Học Kì 1</option>
                        <option value="CK1">Cuối Học Kì 1</option>
                        <option value="KTTX Lần 3">Kiểm Tra Thường Xuyên Lần 1 (HK2)</option>
                        <option value="KTTX Lần 4">Kiểm Tra Thường Xuyên Lần 2 (HK2)</option>
                        <option value="GK2">Giữa Học Kì 2</option>
                        <option value="CK2">Cuối Học Kì 2</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Họ và Tên *</label>
                    <input type="text" id="studentNameInput" required placeholder="Ví dụ: Nguyễn Văn An" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Lớp *</label>
                    <input type="text" id="studentClassInput" required placeholder="Ví dụ: 6A1" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" id="btnLoginSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm transition cursor-pointer">
                    Vào Phòng Thi
                </button>
            </form>
        </section>

        <!-- KHU VỰC LÀM BÀI THI -->
        <section id="examSection" class="hidden space-y-6">
            <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-indigo-900" id="examTitleLabel">Bài Kiểm Tra Thể Chất</h3>
                </div>
                <div class="text-right">
                    <span id="questionCountBadge" class="text-xs bg-indigo-600 text-white px-3 py-1 rounded-full font-bold">20 Câu Hỏi</span>
                </div>
            </div>

            <form id="examForm" onsubmit="submitExam(event)" class="space-y-6">
                <div id="questionsContainer" class="space-y-6"></div>
                <div class="text-center pt-4">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3.5 rounded-xl text-base shadow-lg transition">
                        Nộp Bài Kiểm Tra Ngay
                    </button>
                </div>
            </form>
        </section>

        <!-- KHU VỰC KẾT QUẢ -->
        <section id="resultSection" class="hidden bg-white rounded-2xl shadow-md p-8 border max-w-lg mx-auto text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800">Nộp Bài Thành Công!</h2>
            <p class="text-sm text-slate-600">Hệ thống đã tự động chấm điểm bài làm của bạn:</p>
            <div class="p-4 bg-slate-50 rounded-xl text-center">
                Điểm tổng kết: <b id="resTotal" class="text-indigo-700 text-xl block mt-1">0 đ</b>
            </div>
            <button onclick="location.reload()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl text-sm font-semibold">Quay Lại Trang Chủ</button>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, getDoc, doc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBe4ehs7teJcj2rq3DruF6zIginmBal_Wk",
            authDomain: "kiem-tra-the-chat.firebaseapp.com",
            projectId: "kiem-tra-the-chat",
            storageBucket: "kiem-tra-the-chat.firebasestorage.app",
            messagingSenderId: "585367267362",
            appId: "1:585367267362:web:974b579f400e3f3074427b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.fsTools = { getDoc, doc, addDoc, collection };
    </script>

    <script>
        const RAW_QUESTIONS = [
            { id: 1, type: "choice", text: "Câu 1: Trong chế độ dinh dưỡng tập luyện thể dục thể thao, nhóm thực phẩm nào sau đây cung cấp nhiều chất đường bột (Carbohydrate) cho cơ thể?", options: ["A. Cơm, bánh mì, khoai, ngô.", "B. Nước lọc đóng chai.", "C. Muối ăn hằng ngày.", "D. Đá viên làm lạnh."], correct: 0 },
            { id: 2, type: "choice", text: "Câu 2: Thực phẩm nào dưới đây giàu chất đạm (Protein) giúp xây dựng và phát triển cơ bắp khi tập luyện thể dục thể thao?", options: ["A. Thịt, cá, trứng, sữa, đậu đỗ.", "B. Nước ngọt có ga.", "C. Kẹo cao su.", "D. Nước đá lạnh."], correct: 0 },
            { id: 3, type: "choice", text: "Câu 3: Để cung cấp nhiều vitamin và chất khoáng cho cơ thể khi tập luyện, hằng ngày em cần ăn nhóm thực phẩm nào?", options: ["A. Rau xanh và các loại quả chín.", "B. Kẹo mút nhiều màu sắc.", "C. Đồ ăn nhanh chiên nhiều dầu mỡ.", "D. Nước ngọt đóng lon."], correct: 0 },
            { id: 4, type: "choice", text: "Câu 4: Vì sao nước là yếu tố dinh dưỡng đặc biệt quan trọng đối với người tập luyện thể dục thể thao?", options: ["A. Vì nước giúp bù lại lượng mồ hôi đã mất, điều hòa thân nhiệt và giúp cơ thể không bị mệt lả.", "B. Vì uống nước giúp học sinh không cần phải ăn cơm hay thức ăn trong cả tuần.", "C. Vì nước giúp cơ thể nặng hơn để đứng yên một chỗ không phải vận động.", "D. Vì uống nước giúp thay thế hoàn toàn việc khởi động khớp trước khi tập."], correct: 0 },
            { id: 5, type: "choice", text: "Câu 5: Điều gì sẽ xảy ra với cơ thể nếu học sinh nhịn ăn sáng và để bụng đói khi tham gia giờ học Giáo dục thể chất?", options: ["A. Cơ thể bị thiếu năng lượng, dễ bị mệt mỏi, hoa mắt, chóng mặt và tập luyện kém hiệu quả.", "B. Cơ thể sẽ có nhiều sức mạnh hơn và chạy nhanh hơn bình thường.", "C. Cơ bắp sẽ phát triển to khỏe ngay lập tức mà không cần tập luyện.", "D. Cơ thể không bao giờ bị khát nước trong suốt buổi học."], correct: 0 },
            { id: 6, type: "choice", text: "Câu 6: Theo điều luật cơ bản trong chạy cự li ngắn, người chạy chỉ được phép rời khỏi vị trí xuất phát để bắt đầu chạy khi nào?", options: ["A. Khi có hiệu lệnh “Chạy!\" (hoặc tiếng còi, cờ lệnh) của người điều khiển.", "B. Khi mới nghe khẩu lệnh \"Vào chỗ!\".", "C. Khi tự ý thích chạy lúc nào thì chạy trước các bạn.", "D. Khi trọng tài còn đang kiểm tra danh sách ở bàn."], correct: 0 },
            { id: 7, type: "choice", text: "Câu 7: Trong giờ học Chạy cự li ngắn lớp 6, trò chơi vận động nào dưới đây thường được sử dụng để rèn luyện và phát triển sức nhanh?", options: ["A. Trò chơi \"Chạy tiếp sức\" (hoặc \"Chạy đuổi\").", "B. Trò chơi \"Đứng yên một chân nhắm mắt ngủ\".", "C. Trò chơi \"Ngồi đánh cờ vua trong lớp\".", "D. Trò chơi \"Nằm im đọc truyện tranh\"."], correct: 0 },
            { id: 8, type: "choice", text: "Câu 8: Kĩ thuật chạy cự li ngắn (60m) ở lớp 6 bao gồm mấy giai đoạn theo đúng thứ tự từ lúc bắt đầu đến lúc kết thúc?", options: ["A. 4 giai đoạn: Xuất phát - Chạy lao sau xuất phát - Chạy giữa quãng – Về đích.", "B. 2 giai đoạn: Đứng nhìn đường chạy – Đi bộ về chỗ ngồi.", "C. 3 giai đoạn: Chạy về đích – Chạy giữa quãng – Xuất phát.", "D. 1 giai đoạn duy nhất là Đứng yên tại vạch đích."], correct: 0 },
            { id: 9, type: "choice", text: "Câu 9: Trong giờ học Giáo dục thể chất lớp 6, các hình thức tổ chức tập luyện kĩ thuật chạy cự li ngắn thường gồm những hình thức nào?", options: ["A. Tập luyện cá nhân, tập luyện theo cặp/nhóm (tổ) và tập luyện cả lớp.", "B. Chỉ có hình thức ngồi xem tivi ở nhà.", "C. Chỉ có hình thức thi đấu giải vô địch quốc gia.", "D. Chỉ có hình thức làm bài kiểm tra viết trên giấy."], correct: 0 },
            { id: 10, type: "choice", text: "Câu 10: Khi điều khiển tổ, nhóm tập luyện kĩ thuật xuất phát cao, người chỉ huy cần hô lần lượt 3 khẩu lệnh nào theo đúng thứ tự?", options: ["A. \"Vào chỗ!\" – \"Sẵn sàng!\" - \"Chạy!\".", "B. \"Chạy!\" - \"Vào chỗ!\" - \"Nghỉ!\".", "C. \"Nằm xuống!\" – \"Ngồi dậy!\" – \"Đi bộ!\".", "D. \"Nhắm mắt!\" - \"Quay sau!\" - \"Đứng lại!\"."], correct: 0 },
            { id: 11, type: "choice", text: "Câu 11: Trong kĩ thuật chạy cự li ngắn 60m, giai đoạn \"Chạy lao sau xuất phát\" có vai trò chính là gì?", options: ["A. Giúp người chạy nhanh chóng tăng tốc độ từ vị trí xuất phát để chuyển vào chạy giữa quãng.", "B. Giúp người chạy dừng hẳn lại tại vạch xuất phát để buộc lại dây giày.", "C. Giúp người chạy đi bộ chậm rãi để nghỉ mệt ngay khi vừa rời vạch xuất phát.", "D. Giúp người chạy quay lưng chạy ngược về phía sau vạch xuất phát."], correct: 0 },
            { id: 12, type: "choice", text: "Câu 12: Khi thực hiện động tác bổ trợ “Chạy bước nhỏ\", bàn chân của người tập tiếp xúc với mặt đất như thế nào là đúng kĩ thuật?", options: ["A. Tiếp đất bằng nửa trước bàn chân, cổ chân linh hoạt, bước chân ngắn và nhanh.", "B. Tiếp đất mạnh bằng cả gót chân và giữ thẳng cứng hai đầu gối.", "C. Nhảy chụm cả hai chân cùng một lúc như nhảy bao bố.", "D. Ngồi xổm dưới đất và lết hai bàn chân đi tới."], correct: 0 },
            { id: 13, type: "choice", text: "Câu 13: Động tác bổ trợ nào có đặc điểm: \"Chân sau đạp duỗi thẳng hoàn toàn, đùi chân trước nâng cao đưa ra trước, thân trên hơi ngả về trước, hai tay đánh phối hợp tự nhiên\"?", options: ["A. Động tác Chạy đạp sau.", "B. Động tác Đứng nghiêm chào cờ.", "C. Động tác Ngồi gập thân tại chỗ.", "D. Động tác Xoay cổ tay cổ chân."], correct: 0 },
            { id: 14, type: "choice", text: "Câu 14: Khi quan sát bạn thực hiện giai đoạn “Chạy giữa quãng\", nếu thấy bạn mắc lỗi \"đánh hai tay vung ngang bắt chéo trước ngực\", em cần nhắc bạn sửa sai như thế nào?", options: ["A. Gập khuỷu tay vừa phải và đánh tay nhịp nhàng theo hướng trước sau phối hợp với bước chân.", "B. Buộc chặt hai tay vào sát hai bên đùi không cho cử động khi chạy.", "C. Giơ thẳng cả hai tay lên cao quá đầu trong suốt quãng đường chạy.", "D. Chắp hai tay ra sau lưng giống như đang đi dạo."], correct: 0 },
            { id: 15, type: "choice", text: "Câu 15: Để đảm bảo an toàn và phòng tránh chấn thương trước khi bước vào tập luyện Chạy cự li ngắn, học sinh bắt buộc phải làm việc gì đầu tiên?", options: ["A. Khởi động kĩ các khớp (cổ tay, cổ chân, gối, hông, vai...) và làm nóng cơ thể.", "B. Chạy hết sức thật nhanh ngay khi vừa bước ra sân mà không cần khởi động.", "C. Tháo giày thể thao ra và đi dép lê trơn trượt để chạy.", "D. Đứng chen lấn, xô đẩy các bạn trên đường chạy."], correct: 0 },
            { id: 16, type: "true_false", text: "Câu 16: Theo điều luật cơ bản trong chạy cự li ngắn, mỗi người chạy phải chạy đúng trong ô (làn) đường chạy của mình, không được lấn sang đường chạy để cản trở hay xô đẩy người bên cạnh.", correct: "Đúng" },
            { id: 17, type: "true_false", text: "Câu 17: Ở chương trình Giáo dục thể chất lớp 6 (sách Kết nối tri thức), trong giai đoạn Xuất phát của chạy cự li ngắn 60m, học sinh được học kĩ thuật Xuất phát cao.", correct: "Đúng" },
            { id: 18, type: "true_false", text: "Câu 18: Trong kĩ thuật chạy cự li ngắn 60m, vai trò của giai đoạn Chạy giữa quãng là giúp người chạy dừng hẳn lại giữa đường để ngồi nghỉ uống nước.", correct: "Sai" },
            { id: 19, type: "true_false", text: "Câu 19: Khi thực hiện kĩ thuật Xuất phát cao ở khẩu lệnh 'Vào chỗ!', nếu học sinh đặt cả hai chân giẫm đè lên trên vạch xuất phát là sai quy định, cần điều chỉnh lùi mũi chân trước về sát mép sau của vạch xuất phát.", correct: "Đúng" },
            { id: 20, type: "true_false", text: "Câu 20: Để đảm bảo an toàn trong giai đoạn Về đích chạy 60m, ngay khi ngực vừa chạm qua vạch đích, người chạy phải đứng khựng lại đột ngột hoặc ngồi thụp ngay xuống vạch đích.", correct: "Sai" }
        ];

        let currentStudent = { name: '', className: '', grade: '', period: '' };
        let activeExamQuestions = []; // Lưu đề đã xáo trộn riêng cho học sinh này

        // Hàm xáo trộn mảng (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        async function handleStudentLogin(e) {
            e.preventDefault();
            const grade = document.getElementById('studentGradeSelect').value;
            const period = document.getElementById('studentPeriodSelect').value;
            const name = document.getElementById('studentNameInput').value.trim();
            const className = document.getElementById('studentClassInput').value.trim();

            if (grade !== "6" || period !== "KTTX Lần 1") {
                alert("Đợt kiểm tra này hiện chưa mở hoặc chưa có bộ đề! Hiện chỉ đang mở: Khối 6 - Kiểm Tra Thường Xuyên Lần 1.");
                return;
            }

            try {
                const statusSnap = await window.fsTools.getDoc(window.fsTools.doc(window.db, "config", "exam_status"));
                if (!statusSnap.exists() || !statusSnap.data().isOpen) {
                    alert("Kỳ thi hiện đang bị ĐÓNG bởi giáo viên. Bạn chưa thể vào làm bài!");
                    return;
                }
                const serverGrade = statusSnap.data().grade || "6";
                const serverPeriod = statusSnap.data().period || "KTTX Lần 1";

                if (String(serverGrade) !== String(grade) || serverPeriod !== period) {
                    alert(`Giáo viên đang mở đề cho [Khối ${serverGrade} - ${serverPeriod}], không phải đợt bạn chọn!`);
                    return;
                }
            } catch (err) {
                alert("Lỗi kết nối kiểm tra trạng thái thi!");
                return;
            }

            currentStudent = { name, className, grade, period };
            document.getElementById('studentInfoDisplay').innerText = `Khối ${grade} (${period}) | ${name} - Lớp ${className}`;
            document.getElementById('studentInfoDisplay').classList.remove('hidden');

            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('examSection').classList.remove('hidden');
            document.getElementById('examTitleLabel').innerText = `ĐỀ KIỂM TRA THƯỜNG XUYÊN (LẦN 1) - KHỐI ${grade}`;

            // XÁO TRỘN CÂU HỎI VÀ ĐÁP ÁN KHI HỌC SINH VÀO THI
            activeExamQuestions = shuffleArray(RAW_QUESTIONS).map(q => {
                let clonedQ = { ...q };
                if (clonedQ.type === 'choice') {
                    // Ghép options với index gốc để theo dõi đáp án đúng sau khi trộn
                    let indexedOptions = clonedQ.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                    let shuffledOptions = shuffleArray(indexedOptions);
                    
                    clonedQ.shuffledOptions = shuffledOptions;
                    // Tìm vị trí mới của đáp án đúng
                    clonedQ.newCorrectIndex = shuffledOptions.findIndex(item => item.originalIndex === clonedQ.correct);
                }
                return clonedQ;
            });

            renderExamQuestions();
        }

        function renderExamQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            activeExamQuestions.forEach((q, index) => {
                if (q.type === 'choice') {
                    let optionsHtml = q.shuffledOptions.map((optObj, oIdx) => `
                        <label class="flex items-center gap-3 p-3 bg-slate-50 border rounded-xl cursor-pointer hover:bg-slate-100 transition">
                            <input type="radio" name="q_${q.id}" value="${oIdx}" class="w-4 h-4 text-indigo-600">
                            <span class="text-sm text-slate-700">${optObj.text}</span>
                        </label>
                    `).join('');

                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-3">
                            <h4 class="font-bold text-slate-800 text-sm">Câu ${index + 1}: ${q.text.replace(/^Câu \d+:\s*/, '')}</h4>
                            <div class="space-y-2">${optionsHtml}</div>
                        </div>
                    `;
                } else if (q.type === 'true_false') {
                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-3">
                            <h4 class="font-bold text-slate-800 text-sm">Câu ${index + 1}: ${q.text.replace(/^Câu \d+:\s*/, '')}</h4>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-2 p-3 bg-slate-50 border rounded-xl cursor-pointer hover:bg-slate-100 transition flex-1">
                                    <input type="radio" name="q_${q.id}" value="0" class="w-4 h-4 text-indigo-600">
                                    <span class="text-sm font-semibold text-emerald-700">Đúng</span>
                                </label>
                                <label class="flex items-center gap-2 p-3 bg-slate-50 border rounded-xl cursor-pointer hover:bg-slate-100 transition flex-1">
                                    <input type="radio" name="q_${q.id}" value="1" class="w-4 h-4 text-indigo-600">
                                    <span class="text-sm font-semibold text-rose-700">Sai</span>
                                </label>
                            </div>
                        </div>
                    `;
                }
            });
        }

        async function submitExam(e) {
            e.preventDefault();
            if (!confirm("Bạn có chắc chắn muốn nộp bài không?")) return;

            let correctCount = 0;
            let totalQuestions = activeExamQuestions.length;
            let answersLog = [];

            activeExamQuestions.forEach(q => {
                const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                const val = selected ? parseInt(selected.value) : -1;
                let isCorrect = false;

                if (q.type === 'choice') {
                    isCorrect = (val === q.newCorrectIndex);
                } else if (q.type === 'true_false') {
                    const correctVal = (q.correct === "Đúng" ? 0 : 1);
                    isCorrect = (val === correctVal);
                }

                if (isCorrect) correctCount++;

                let studentAnsText = "Không trả lời";
                let correctAnsText = "";

                if (q.type === 'choice') {
                    studentAnsText = val !== -1 ? q.shuffledOptions[val].text : "Không trả lời";
                    correctAnsText = q.shuffledOptions[q.newCorrectIndex].text;
                } else {
                    studentAnsText = val === 0 ? "Đúng" : (val === 1 ? "Sai" : "Không trả lời");
                    correctAnsText = q.correct;
                }

                answersLog.push({
                    type: q.type,
                    questionText: q.text,
                    studentAnswer: studentAnsText,
                    correctAnswer: correctAnsText,
                    isCorrect: isCorrect
                });
            });

            const finalScore = parseFloat(((correctCount / totalQuestions) * 10).toFixed(1));

            try {
                await window.fsTools.addDoc(window.fsTools.collection(window.db, "submissions"), {
                    grade: currentStudent.grade,
                    examPeriod: currentStudent.period,
                    studentName: currentStudent.name,
                    className: currentStudent.className,
                    submittedAt: new Date().toISOString(),
                    totalScore: finalScore,
                    status: 'graded',
                    answers: answersLog
                });

                document.getElementById('examSection').classList.add('hidden');
                document.getElementById('resultSection').classList.remove('hidden');
                document.getElementById('resTotal').innerText = `${finalScore} / 10 điểm (${correctCount}/${totalQuestions} câu đúng)`;
            } catch (err) {
                alert("Lỗi khi nộp bài: " + err.message);
            }
        }
    </script>
</body>
